  if(!ids.length){v.innerHTML='<div class="c">Aucune pièce pour l’instant.<div class="row"><button class="btn" onclick="seed()" '+(busy?'disabled':'')+'>'+(busy?'Import en cours…':'Importer mon stock ('+SEED.length+' pièces)')+'</button></div><div class="mu">'+esc(msg)+'</div></div>';return}
  stockView(v,ids)}
 else if(tab==="hist"){const l=Object.values(sales).sort((a,b)=>String(b.sold_at).localeCompare(String(a.sold_at)));
  v.innerHTML=l.length?l.map(s=>{const p=parts[s.part_id]||{};return '<div class="c"><div class="r"><b>'+esc(p.piece||"Pièce supprimée")+'</b><span class="b ok">'+(+s.price).toFixed(2)+' €</span></div><div class="mu">'+esc(p.ref)+' · quantité '+s.qty+' · '+new Date(s.sold_at).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"})+'</div><div class="r"><span class="mu">'+esc(s.platform||"")+(s.sold_by?' · par '+esc(String(s.sold_by).split("@")[0]):'')+'</span><button class="btn g" style="padding:6px 10px" onclick="delSale(\''+s.id+'\')">Supprimer</button></div></div>'}).join(""):'<div class="c">Aucune vente enregistrée.</div>'}
 else{v.innerHTML='<div class="c"><b>Nouvelle pièce</b>'+["piece:Type de pièce","marque:Marque","ref:Référence","mv:Marque véhicule","modele:Modèle / compatibilité","num:N° de carton","qty0:Quantité"].map(x=>{const[k,l]=x.split(":");return '<label>'+l+'</label><input class="s" id="f_'+k+'"'+(k==="qty0"?' type="number" inputmode="numeric"':'')+'>'}).join("")+'<div class="row"><button class="btn" onclick="addPart()">Enregistrer</button></div></div><div class="row"><button class="btn g" onclick="sb.auth.signOut()">Se déconnecter ('+esc(String(me.email).split("@")[0])+')</button></div>'}}
function ci(c){return ico(c)}
function stockView(v,ids){const w=norm($("#q").value).split(/\s+/).filter(Boolean);
 if(!w.length&&!fc&&!fm&&!fv){const n={};ids.forEach(id=>{const c=cat(parts[id]);n[c]=(n[c]||0)+1});
  v.innerHTML='<div class="grid">'+CATS.map(c=>c[0]).concat("Autres").filter(c=>n[c]).map(c=>'<div class="t" onclick="fc=\''+c+'\';render()"><div class="em">'+ico(c)+'</div><b>'+c+'</b><span class="mu">'+n[c]+' réf.</span></div>').join("")+'</div>';return}
 const base=ids.filter(id=>{const p=parts[id];return(!fc||cat(p)===fc)&&w.every(x=>norm([p.ref,p.piece,p.marque,p.modele,p.mv,p.num].join(" ")).includes(x))});
 const res=base.filter(id=>{const p=parts[id];return(!fm||p.marque===fm)&&(!fv||vb(p).includes(fv))}).sort((a,b)=>norm(parts[a].piece).localeCompare(norm(parts[b].piece)));
 const top=f=>{const n={};base.forEach(id=>f(parts[id]).forEach(x=>n[x]=(n[x]||0)+1));return Object.entries(n).sort((a,b)=>b[1]-a[1]).slice(0,14)};
 CH.m=top(p=>p.marque?[p.marque]:[]);CH.v=top(vb);
 const chips=(k,sel)=>'<div class="ch">'+CH[k].map((x,i)=>'<button class="'+(x[0]===sel?'on':'')+'" onclick="tg(\''+k+'\','+i+')">'+esc(x[0])+' · '+x[1]+'</button>').join("")+'</div>';
 v.innerHTML='<div class="row" style="align-items:center"><button class="btn g" style="flex:0 0 auto" onclick="fc=fm=fv=\'\';$(\'#q\').value=\'\';render()">← Catégories</button><b>'+esc(fc||"Résultats")+'</b></div>'+(CH.m.length>1?'<div class="mu">Marque de la pièce</div>'+chips("m",fm):'')+(CH.v.length>1?'<div class="mu">Véhicule</div>'+chips("v",fv):'')+'<div class="mu" style="padding:4px 2px">'+res.length+' référence(s)</div><div class="grid">'+res.slice(0,lim).map(id=>{const p=parts[id],s=stock(id);return '<div class="pc" onclick="open_(\''+id+'\')"><div class="ph">'+ico(cat(p))+'</div><div class="pb"><b>'+esc(p.piece)+'</b><div class="mu">'+esc(p.marque)+'</div><div class="mu">'+esc(p.ref)+'</div><span class="b '+(s>0?'ok':'ko')+'" style="align-self:flex-start">'+s+' en stock</span></div></div>'}).join("")+'</div>'+(res.length>lim?'<div class="row"><button class="btn g" onclick="lim+=60;render()">Voir plus</button></div>':'')}
function tg(k,i){const x=CH[k][i][0];if(k==="m")fm=fm===x?"":x;else fv=fv===x?"":x;lim=60;render()}
function modal(h){$("#md").innerHTML='<div class="m" onclick="if(event.target===this)closeM()"><div>'+h+'</div></div>'}
function closeM(){$("#md").innerHTML=""}
function open_(id){const p=parts[id];modal('<b>'+esc(p.piece)+'</b><div class="mu">'+esc(p.marque)+' · '+esc(p.ref)+(p.num?' · carton n° '+esc(p.num):'')+'<br>'+esc([p.mv,p.modele].filter(Boolean).join(" — "))+'</div><div style="margin:10px 0">En stock : <b>'+stock(id)+'</b></div><label>Quantité vendue</label><input class="s" id="sq" type="number" inputmode="numeric" value="1"><label>Prix de vente réel (€)</label><input class="s" id="sp" type="number" inputmode="decimal"><label>Où ? (Leboncoin, main propre…)</label><input class="s" id="sw"><div class="row"><button class="btn" onclick="sell(\''+id+'\')">Enregistrer la vente</button></div><label>Corriger le stock réel</label><div class="row"><input class="s" id="cs" type="number" inputmode="numeric" value="'+stock(id)+'"><button class="btn g" onclick="fix(\''+id+'\')">Corriger</button></div><div class="row"><button class="btn g" onclick="closeM()">Fermer</button></div>')}
function fail(e){alert("Échec : "+(e&&e.message||e))}
async function sell(id){const q=+$("#sq").value,pr=+$("#sp").value;if(!(q>0)||$("#sp").value===""||!(pr>=0))return alert("Mets une quantité et un prix.");if(q>stock(id)&&!confirm("Plus que le stock affiché. Enregistrer quand même ?"))return;
 const r=await sb.from("sales").insert({part_id:id,qty:q,price:pr,platform:$("#sw").value,sold_by:me.email});if(r.error)return fail(r.error);closeM();load()}
async function fix(id){const n=+$("#cs").value;if(!(n>=0))return;const r=await sb.from("parts").update({qty0:n+sold(id)}).eq("id",id);if(r.error)return fail(r.error);closeM();load()}
async function delSale(id){if(!confirm("Supprimer cette vente ? Le stock sera remis."))return;const r=await sb.from("sales").delete().eq("id",id);if(r.error)return fail(r.error);load()}
async function addPart(){const g=k=>$("#f_"+k).value.trim(),p={piece:g("piece"),marque:g("marque"),ref:g("ref"),mv:g("mv"),modele:g("modele"),num:g("num"),qty0:+g("qty0")||0};if(!p.piece)return alert("Indique le type de pièce.");
 const r=await sb.from("parts").insert(p);if(r.error)return fail(r.error);await load();setTab("stock")}
async function seed(){busy=true;msg="";render();const rows=SEED.map((p,i)=>Object.assign({id:"i"+i},p));const r=await sb.from("parts").upsert(rows);busy=false;if(r.error){msg="Échec : "+r.error.message}await load()}
async function login(){msg="";const r=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});if(r.error){msg="Email ou mot de passe incorrect.";render()}}
async function load(){if(!me)return;const [a,b]=await Promise.all([sb.from("parts").select("*").limit(5000),sb.from("sales").select("*").limit(5000)]);
 if(a.error||b.error){msg="Erreur de chargement : "+(a.error||b.error).message}else{parts={};a.data.forEach(p=>parts[p.id]=p);sales={};b.data.forEach(s=>sales[s.id]=s)}render()}
function later(){clearTimeout(tm);tm=setTimeout(load,250)}
function subscribe(){if(subbed)return;subbed=true;sb.channel("stock").on("postgres_changes",{event:"*",schema:"public",table:"parts"},later).on("postgres_changes",{event:"*",schema:"public",table:"sales"},later).subscribe();document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()})}
setInterval(()=>{if(me&&!document.hidden)load()},20000);
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>setTab(b.dataset.t));
$("#q").oninput=()=>{lim=60;if(tab!=="stock")setTab("stock");else render()};
sb.auth.onAuthStateChange((ev,s)=>{me=s?s.user:null;if(me){subscribe();load()}else{parts={};sales={};render()}});
sb.auth.getSession().then(r=>{me=r.data.session?r.data.session.user:null;if(me){subscribe();load()}else render()});
</script></body></html>
