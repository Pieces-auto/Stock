<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Pièces auto neuves</title><style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14171c;--mu:#6a7280;--ac:#0a6cff;--ok:#12805c;--ko:#c0392b;--bd:#e2e5ea;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101216;--card:#1b1e24;--tx:#eef0f3;--mu:#98a1b0;--ac:#4d94ff;--ok:#3ecf9a;--ko:#ff7b6b;--bd:#2c313a;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.35 -apple-system,system-ui,sans-serif;padding-bottom:40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 12px;z-index:5}h1{font-size:20px;margin:2px 0 8px}
input,button{font:inherit;color:var(--tx)}.s{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card)}
main{padding:0 12px}.mu{color:var(--mu);font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.t{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px 10px;text-align:center;display:flex;flex-direction:column;gap:4px}.em{font-size:40px}
.pc{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden}.ph{height:80px;display:flex;align-items:center;justify-content:center;font-size:36px;background:var(--bg)}
.pb{padding:8px 10px;display:flex;flex-direction:column;gap:2px}.pb b{font-size:15px;line-height:1.2}
.b{display:inline-block;padding:3px 9px;border-radius:99px;font-weight:700;font-size:14px;align-self:flex-start;margin-top:3px}.ok{background:rgba(18,128,92,.15);color:var(--ok)}.ko{background:rgba(192,57,43,.15);color:var(--ko)}
.ch{display:flex;gap:6px;overflow-x:auto;padding:4px 0}.ch button{white-space:nowrap;padding:7px 12px;border-radius:99px;border:1px solid var(--bd);background:var(--card)}.ch button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.btn{padding:11px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);font-weight:600}
.m{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:20}.m>div{background:var(--card);width:100%;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto}
</style></head><body><header><h1>Pièces auto neuves</h1><input id="q" class="s" type="search" placeholder="Rechercher : référence, pièce, marque, voiture…"></header><main id="v"></main><div id="md"></div>
<script>
let D=[];const U="https://uirtozwttaeqyvlqypsg.supabase.co/rest/v1/catalogue?select=piece,marque,ref,mv,modele,dispo&limit=5000",K="sb_publishable_jNlyTZjeTX-KqNxVHw7UQw_gqfjIl0p";
fetch(U,{headers:{apikey:K}}).then(r=>r.json()).then(a=>{if(!Array.isArray(a))throw 0;D=a.map(x=>({p:x.piece||"",m:x.marque||"",r:x.ref||"",mv:x.mv||"",mo:x.modele||"",d:!!x.dispo}));render()}).catch(()=>{$("#v").innerHTML='<div class="mu" style="padding:20px">Catalogue indisponible pour le moment. Réessayez dans un instant.</div>'});
let fc="",fm="",fv="",lim=60,CH={m:[],v:[]};
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),norm=s=>String(s??"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const CATS=[["Échappement","💨",/echappement|catalyseur|silencieux|particule|\bfap\b/],["Freinage","🛑",/frein|disque|plaquette|tambour|etrier|machoire|mastervac|servofrein/],["Suspension et direction","🔩",/amortisseur|rotule|silent|triangle|biellette|coupelle|soufflet|cremaill|direction|barre|stabilis|ressort|roulement|moyeu/],["Filtres","🧴",/filtre/],["Refroidissement et clim","❄️",/radiateur|clim|compresseur|condenseur|refroid|thermostat|ventilateur|calorstat/],["Moteur","⚙️",/carter|regulateur|rampe|turbo|egr|papillon|injecteur|vanne|joint|culasse|courroie|distribution|pompe|poulie|bougie/],["Électrique et capteurs","🔌",/capteur|capeteur|\babs\b|sonde|bobine|alternateur|demarreur|relais|debitmetre|lambda|batterie|feu|ampoule|phare/],["Embrayage et transmission","🔗",/embrayage|volant|cardan|boite|transmission/]];
const cat=p=>{const h=norm(p.p);for(const c of CATS)if(c[2].test(h))return c[0];return"Autres"},ico=c=>(CATS.find(x=>x[0]===c)||[0,"📦"])[1],vb=p=>String(p.mv||"").split("/").map(s=>s.trim().toUpperCase()).filter(Boolean);
function render(){const v=$("#v"),w=norm($("#q").value).split(/\s+/).filter(Boolean);
 if(!w.length&&!fc&&!fm&&!fv){const n={};D.forEach(p=>{const c=cat(p);n[c]=(n[c]||0)+1});v.innerHTML='<div class="grid">'+CATS.map(c=>c[0]).concat("Autres").filter(c=>n[c]).map(c=>'<div class="t" onclick="fc=\''+c+'\';render()"><div class="em">'+ico(c)+'</div><b>'+c+'</b><span class="mu">'+n[c]+' réf.</span></div>').join("")+'</div>';return}
 const base=D.map((p,i)=>i).filter(i=>{const p=D[i];return(!fc||cat(p)===fc)&&w.every(x=>norm([p.r,p.p,p.m,p.mo,p.mv].join(" ")).includes(x))});
 const res=base.filter(i=>{const p=D[i];return(!fm||p.m===fm)&&(!fv||vb(p).includes(fv))}).sort((a,b)=>norm(D[a].p).localeCompare(norm(D[b].p)));
 const top=f=>{const n={};base.forEach(i=>f(D[i]).forEach(x=>n[x]=(n[x]||0)+1));return Object.entries(n).sort((a,b)=>b[1]-a[1]).slice(0,14)};
 CH.m=top(p=>p.m?[p.m]:[]);CH.v=top(vb);
 const chips=(k,sel)=>'<div class="ch">'+CH[k].map((x,i)=>'<button class="'+(x[0]===sel?'on':'')+'" onclick="tg(\''+k+'\','+i+')">'+esc(x[0])+' · '+x[1]+'</button>').join("")+'</div>';
 v.innerHTML='<div style="display:flex;gap:10px;align-items:center"><button class="btn" onclick="fc=fm=fv=\'\';$(\'#q\').value=\'\';render()">← Catégories</button><b>'+esc(fc||"Résultats")+'</b></div>'+(CH.m.length>1?'<div class="mu">Marque de la pièce</div>'+chips("m",fm):'')+(CH.v.length>1?'<div class="mu">Véhicule</div>'+chips("v",fv):'')+'<div class="mu" style="padding:4px 2px">'+res.length+' référence(s)</div><div class="grid">'+res.slice(0,lim).map(i=>{const p=D[i];return '<div class="pc" onclick="op('+i+')"><div class="ph">'+ico(cat(p))+'</div><div class="pb"><b>'+esc(p.p)+'</b><div class="mu">'+esc(p.m)+'</div><div class="mu">'+esc(p.r)+'</div><span class="b '+(p.d?'ok':'ko')+'">'+(p.d?'Disponible':'Indisponible')+'</span></div></div>'}).join("")+'</div>'+(res.length>lim?'<button class="btn" style="width:100%" onclick="lim+=60;render()">Voir plus</button>':'')}
function tg(k,i){const x=CH[k][i][0];if(k==="m")fm=fm===x?"":x;else fv=fv===x?"":x;lim=60;render()}
function op(i){const p=D[i];$("#md").innerHTML='<div class="m" onclick="if(event.target===this)$(\'#md\').innerHTML=\'\'"><div><b>'+esc(p.p)+'</b><div class="mu">'+esc(p.m)+' · réf. '+esc(p.r)+'</div><p>'+(esc([p.mv,p.mo].filter(Boolean).join(" — "))||"Compatibilité : nous demander")+'</p><span class="b '+(p.d?'ok':'ko')+'">'+(p.d?'Disponible':'Indisponible')+'</span><p><button class="btn" style="width:100%" onclick="$(\'#md\').innerHTML=\'\'">Fermer</button></p></div></div>'}
$("#q").oninput=()=>{lim=60;render()};render();
</script></body></html>
